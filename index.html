<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nothing Twice</title>
<style>
:root{--paper:#efe7d6;--ink:#221e1a;--cobalt:#2448c8;--verm:#d23c1e;--gold:#b07c14;--steel:#34506a;--muted:#7a6d5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e4dac5;color-scheme:light;color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px}
#top{width:100%;max-width:900px;display:flex;align-items:baseline;gap:10px;padding:2px 4px 6px;min-height:30px}
#lvname{font-size:17px;letter-spacing:.02em;white-space:nowrap}
#lvname small{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
#btns{margin-left:auto;display:flex;gap:6px}
button{font:inherit;font-size:13px;background:transparent;border:1px solid #b9ab92;color:var(--ink);border-radius:14px;padding:3px 10px;cursor:pointer}
button:hover{background:#f6f0e3}
#stage{position:relative;line-height:0}
canvas{display:block;border-radius:6px;box-shadow:0 1px 0 #fff8 inset,0 6px 24px #4a3a2026;cursor:none;touch-action:none}
#hint{width:100%;max-width:900px;min-height:42px;padding:8px 6px 0;font-size:15px;line-height:1.35;text-align:center;color:#3a332b}
#hint b{font-weight:600}
#hint .y{color:var(--cobalt)} #hint .e{color:var(--verm)} #hint .g{color:var(--gold)} #hint .s{color:var(--steel)}
#msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#221e1aee;color:#f3ead8;font-size:14px;padding:6px 14px;border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;line-height:1.3;white-space:nowrap}
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#efe7d6f2;border-radius:6px;text-align:center;padding:20px;line-height:1.45}
#card.hide{display:none}
#card h1{font-weight:400;font-size:40px;margin:0 0 4px;letter-spacing:.04em}
#card h2{font-weight:400;font-size:24px;margin:0 0 6px}
#card .k{color:var(--muted);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
#card p{max-width:520px;margin:8px auto;font-size:16px}
#card button{font-size:16px;padding:6px 20px;margin-top:10px;border-color:#221e1a}
#lvlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px;margin:10px auto}
#lvlist button{min-width:44px}
#lvlist button.done{background:#221e1a;color:#efe7d6}
#pad{display:none;position:absolute;right:10px;bottom:10px;width:120px;height:120px}
#pad button{position:absolute;width:40px;height:40px;border-radius:50%;background:#efe7d6cc;font-size:16px;padding:0}
.touch #pad{display:block}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><div id="lvname"></div><div id="btns"><button id="bUndo" title="Undo (Z)">↶ Undo</button><button id="bReset" title="Restart (R)">⟲ Restart</button><button id="bMenu">Levels</button></div></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="msg"></div>
    <div id="card"></div>
    <div id="pad"><button data-d="0,-1" style="left:40px;top:0">▲</button><button data-d="-1,0" style="left:0;top:40px">◀</button><button data-d="1,0" style="left:80px;top:40px">▶</button><button data-d="0,1" style="left:40px;top:80px">▼</button></div>
  </div>
  <div id="hint"></div>
</div>
<script>
"use strict";
// ───────────────────────── LEVELS ─────────────────────────
// # wall  . floor  _ abyss  = plank over abyss  o stone  @ you
// D / A / E : stones that currently carry the Door / Anchor / Eye shape
const CHAPTERS=[
 {k:"Part one",t:"Nothing in two minds",p:"A thing can only be <b>noticed by one mind at a time</b>. For every other mind, it simply isn't there."},
 {k:"Part two",t:"Nothing in two places",p:"Every shape exists <b>only once</b>. Make a copy of a shape and it isn't a copy: the shape <b>moves</b> into it, and the old one is left as plain stones."},
 {k:"Part three",t:"The Eye is a shape",p:"Look closely at the Eye. It's four stones in a T. And there is only one of every shape…"},
];
const LEVELS=[
{ch:0,name:"Theirs",hint:`The <b class=e>Eye</b> is looking at that wall, so it belongs to the Eye — and <b>isn't there for you</b>. Walk to the <b class=g>Door</b>.`,
 tip:"Careful where you point. If you look at the wall, it's yours again.",
 map:["##############",
      "#####EEE######",
      "######E#######",
      "#@....#....DD#",
      "###########DD#",
      "##############"]},
{ch:0,name:"Yours",hint:`Whatever <b class=y>you</b> look at is <b class=y>yours</b> — so it isn't there for the Eye. It sees right past it.`,
 tip:"Keep looking while you walk.",
 map:["##############",
      "#E############",
      "#EE...#...#DD#",
      "#E.@......#DD#",
      "##........####",
      "##############"]},
{ch:0,name:"Planks",hint:`If the Eye is looking at a plank, the plank isn't there for you. You can only look in one direction.`,
 tip:"Think about the order you do things in.",
 map:["############",
      "###..._.####",
      "#E#.@._.####",
      "#EE.#.=.#DD#",
      "#E####_##DD#",
      "######_#####",
      "############"]},
{ch:1,name:"Only once",hint:`There is only one <b class=g>Door</b> in the world. Build a 2×2 of stones and the Door <b>moves</b> into them.`,
 tip:"Push stones by walking into them.",
 map:["##############",
      "#......#######",
      "#.@....#######",
      "#..oo..###DD##",
      "#..o.o.###DD##",
      "#......#######",
      "##############"]},
{ch:1,name:"Anchor",hint:`Three in a row is the <b class=s>Anchor</b>. Anchored stones can't be pushed. There is only one Anchor.`,
 tip:"",
 map:["#############",
      "#.....#.....#",
      "#.@...A...DD#",
      "#..o..A...DD#",
      "#.o.o.A.....#",
      "#.....#.....#",
      "#############"]},
{ch:1,name:"Fussy",hint:`A shape is exactly its stones. Add one more and it's a different shape — the old shape goes back to the <b>newest</b> copy left.`,
 tip:"That sealed row of three at the top is an older copy of the Anchor.",
 map:["##############",
      "#......#ooo###",
      "#.AAA..#######",
      "#......#######",
      "#.@..o.###DD##",
      "#......###DD##",
      "##############"]},
{ch:2,name:"Aim",hint:`The <b class=e>Eye</b> is four stones in a T, and there's only one Eye. Build a T and the Eye moves into it, looking out of the point.`,
 tip:"",
 map:["############",
      "#EEE########",
      "##E#########",
      "#@....#..DD#",
      "#.o.o.#..DD#",
      "#.o...#....#",
      "#.o...#....#",
      "############"]},
{ch:2,name:"Guard",hint:`The Eye is guarding the bridge, and you can't look at your own feet. There's only one Eye.`,
 tip:"",
 map:["##############",
      "#E#####_######",
      "#EE....=..####",
      "#E#@.o._..####",
      "###.o.._..#DD#",
      "###.o.._..#DD#",
      "###.o.._..####",
      "##############"]},
{ch:2,name:"Past",hint:`Everything at once: an Eye you built, a pillar in its way, and a wall you need it to see.`,
 tip:"",
 map:["##################",
      "#E#####_##########",
      "#EE....=.....#####",
      "#E#@.o._.....#####",
      "###.o.._.....#####",
      "###.o.._..#..#.DD#",
      "###.o.._.....##DD#",
      "#######_##########",
      "##################"]},
];

// ───────────────────────── CORE ─────────────────────────
const FLOOR=0,ABYSS=1;
const SHAPE_OF={door:"O4",anchor:"I3",eye:"T4"};
function canon(cells){
  const tf=[(x,y)=>[x,y],(x,y)=>[-y,x],(x,y)=>[-x,-y],(x,y)=>[y,-x],(x,y)=>[-x,y],(x,y)=>[y,x],(x,y)=>[x,-y],(x,y)=>[-y,-x]];
  let best=null;
  for(const f of tf){const p=cells.map(([x,y])=>f(x,y));let mx=1e9,my=1e9;for(const q of p){mx=Math.min(mx,q[0]);my=Math.min(my,q[1]);}
    const s=p.map(([x,y])=>(x-mx)+","+(y-my)).sort().join(";");if(best===null||s<best)best=s;}
  return best;
}
const CANON={I3:canon([[0,0],[1,0],[2,0]]),O4:canon([[0,0],[1,0],[0,1],[1,1]]),T4:canon([[0,0],[1,0],[2,0],[1,1]])};

let S=null; // state
let levelIndex=0, nextId=1;
const solved=new Set(JSON.parse((()=>{try{return localStorage.getItem("nt_solved")||"[]"}catch(e){return "[]"}})()));
function saveSolved(){try{localStorage.setItem("nt_solved",JSON.stringify([...solved]))}catch(e){}}

function loadLevel(i){
  levelIndex=i;const L=LEVELS[i];
  const h=L.map.length,w=Math.max(...L.map.map(r=>r.length));
  const terr=new Uint8Array(w*h),things=new Array(w*h).fill(null);
  const hostCells={door:[],anchor:[],eye:[]};let px=1,py=1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const c=L.map[y][x]||"#",i2=y*w+x;
    if(c==="#")things[i2]={id:nextId++,t:"wall"};
    else if(c==="_")terr[i2]=ABYSS;
    else if(c==="="){terr[i2]=ABYSS;things[i2]={id:nextId++,t:"plank"};}
    else if("oDAE".includes(c)){things[i2]={id:nextId++,t:"stone"};
      if(c==="D")hostCells.door.push(i2);if(c==="A")hostCells.anchor.push(i2);if(c==="E")hostCells.eye.push(i2);}
    else if(c==="@"){px=x;py=y;}
  }
  S={w,h,terr,things,px,py,stamps:new Map(),counter:1,forms:{},present:Object.keys(hostCells).filter(k=>hostCells[k].length),
     undo:[],dead:null,won:false,anim:{px,py},stoneAnim:new Map(),falls:[],pointer:null,gaze:[],beam:null,owner:new Map(),flash:0,ripples:[],moves:0};
  // initial stamps
  for(const cl of clusters()){const key=cl.join(",");const host=Object.values(hostCells).some(a=>a.some(c=>cl.includes(c)));S.stamps.set(key,host?1:0);}
  computeForms();
  resolveGaze();
  buildFilings();
  renderBackground();
  updateHud();
}
const idx=(x,y)=>y*S.w+x;
const inb=(x,y)=>x>=0&&y>=0&&x<S.w&&y<S.h;
function isStone(i){const t=S.things[i];return t&&t.t==="stone";}
function clusters(){
  const seen=new Uint8Array(S.w*S.h),out=[];
  for(let i=0;i<S.w*S.h;i++){if(seen[i]||!isStone(i))continue;
    const st=[i],cl=[];seen[i]=1;
    while(st.length){const c=st.pop();cl.push(c);const x=c%S.w,y=(c/S.w)|0;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const n=idx(nx,ny);if(!seen[n]&&isStone(n)){seen[n]=1;st.push(n);}}}
    cl.sort((a,b)=>a-b);out.push(cl);}
  return out;
}
function restamp(){
  const ns=new Map();
  for(const cl of clusters()){const key=cl.join(",");ns.set(key,S.stamps.has(key)?S.stamps.get(key):++S.counter);}
  S.stamps=ns;
}
function computeForms(){
  const prev=S.forms||{};const forms={};const cellForm=new Map();
  const cls=clusters();
  for(const type of S.present){
    let best=null,bs=-1;
    for(const cl of cls){const cells=cl.map(c=>[c%S.w,(c/S.w)|0]);if(canon(cells)!==CANON[SHAPE_OF[type]])continue;
      const st=S.stamps.get(cl.join(","))??0;if(st>bs){bs=st;best=cl;}}
    if(best){forms[type]={cells:best};for(const c of best)cellForm.set(c,type);
      if(type==="eye"){ // find nose
        const set=new Set(best);let center=null;
        for(const c of best){const x=c%S.w,y=(c/S.w)|0;let n=0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(set.has(idx(x+dx,y+dy)))n++;if(n===3)center=c;}
        const cx=center%S.w,cy=(center/S.w)|0;
        for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){if(set.has(idx(cx+dx,cy+dy))&&!set.has(idx(cx-dx,cy-dy))){forms.eye.nose=idx(cx+dx,cy+dy);forms.eye.dir=[dx,dy];}}
      }}
  }
  // detect moves for effects
  for(const type of S.present){const a=prev[type]&&prev[type].cells.join(","),b=forms[type]&&forms[type].cells.join(",");
    if(prev[type]!==undefined&&a!==b&&forms[type]){S.ripples.push({type,cells:forms[type].cells,from:prev[type]?prev[type].cells:null,t:0});sfx("form",type);}}
  S.forms=forms;S.cellForm=cellForm;
}
const formAt=i=>S.cellForm.get(i);
// does a thing block passage/sight (for whoever it exists for)?
function blocks(i){const t=S.things[i];if(!t)return false;if(t.t==="wall")return true;if(t.t==="stone")return formAt(i)!=="door";return false;}
function existsFor(i,who){const t=S.things[i];if(!t)return false;const o=S.owner.get(t.id);return !o||o===who;}

// gaze: your ray goes toward the pointer and takes everything it touches, up to the first solid thing.
function yourRay(){
  const out=[];if(!S.pointer)return out;
  const ox=S.px+.5,oy=S.py+.5;let dx=S.pointer.x-ox,dy=S.pointer.y-oy;const d=Math.hypot(dx,dy);
  const pc=inb(Math.floor(S.pointer.x),Math.floor(S.pointer.y))?idx(Math.floor(S.pointer.x),Math.floor(S.pointer.y)):-1;
  const own=idx(S.px,S.py);
  if(pc===own){S.gazeEnd={x:S.pointer.x,y:S.pointer.y};return out;}
  dx/=d;dy/=d;let last=own,end=d;
  for(let t=0;t<=d+1e-6;t+=0.03){const x=Math.floor(ox+dx*t),y=Math.floor(oy+dy*t);if(!inb(x,y)){end=t;break;}const c=idx(x,y);if(c===last)continue;last=c;
    if(S.things[c]){out.push(c);if(blocks(c)){end=Math.min(d,rayExit(ox,oy,dx,dy,x,y));break;}}}
  S.gazeEnd={x:ox+dx*end,y:oy+dy*end};
  return out;
}
function rayExit(ox,oy,dx,dy,x,y){ // distance to center-ish of blocking cell
  const cx=x+.5,cy=y+.5;return Math.max(0,(cx-ox)*dx+(cy-oy)*dy);}
function eyeBeam(yours){
  const out=[];const E=S.forms.eye;if(!E){S.beam=null;return out;}
  const[dx,dy]=E.dir;let x=E.nose%S.w,y=(E.nose/S.w)|0;const sx=x,sy=y;
  while(true){x+=dx;y+=dy;if(!inb(x,y))break;const c=idx(x,y);const t=S.things[c];
    if(t&&!yours.has(t.id)){out.push(c);if(blocks(c))break;}}
  S.beam={sx,sy,ex:x,ey:y,dir:E.dir};
  return out;
}
function resolveGaze(){
  const mine=yourRay();const yours=new Set(mine.map(c=>S.things[c].id));
  const theirs=eyeBeam(yours);
  const own=new Map();for(const id of yours)own.set(id,"you");for(const c of theirs){const id=S.things[c].id;if(!own.has(id))own.set(id,"eye");}
  // sound on changes
  let gained=0;for(const[id,o]of own)if(S.owner.get(id)!==o)gained++;
  if(gained&&S.owner.size+own.size>0)sfx("claim");
  S.owner=own;S.gaze=mine;
}

// ───────────────────────── RULES / MOVES ─────────────────────────
function snapshot(){return{things:S.things.map(t=>t&&{id:t.id,t:t.t}),px:S.px,py:S.py,stamps:new Map(S.stamps),counter:S.counter};}
function restore(s){S.things=s.things;S.px=s.px;S.py=s.py;S.stamps=s.stamps;S.counter=s.counter;S.forms={...S.forms};computeFormsQuiet();S.anim.px=S.px;S.anim.py=S.py;S.stoneAnim.clear();}
function computeFormsQuiet(){const r=S.ripples.length;computeForms();S.ripples.length=r;}
let busyUntil=0;
function tryMove(dx,dy){
  if(!S||S.dead||S.won)return;
  const nx=S.px+dx,ny=S.py+dy;if(!inb(nx,ny))return;
  const i=idx(nx,ny),th=S.things[i];const snap=snapshot();
  if(th&&existsFor(i,"you")){
    if(th.t==="wall"){bump(dx,dy);return;}
    if(th.t==="stone"){const f=formAt(i);
      if(f==="anchor"||f==="eye"){bump(dx,dy);say(f==="anchor"?"Anchored. It won't budge.":"The Eye won't budge.");return;}
      if(f!=="door"){const bx=nx+dx,by=ny+dy;if(!inb(bx,by)){bump(dx,dy);return;}const j=idx(bx,by);
        if(S.things[j]){bump(dx,dy);return;}
        S.stoneAnim.set(th.id,{x:nx,y:ny});
        if(S.terr[j]===ABYSS){S.things[i]=null;S.falls.push({x:bx,y:by,t:0});sfx("drop");}
        else{S.things[j]=th;S.things[i]=null;sfx("push");}
        restamp();computeForms();}
    }
  }
  S.undo.push(snap);S.px=nx;S.py=ny;S.moves++;sfx("step");
  resolveGaze();check();
}
function bump(dx,dy){S.anim.px+=dx*.18;S.anim.py+=dy*.18;sfx("bump");}
function check(){
  if(S.dead||S.won)return;
  const i=idx(S.px,S.py),t=S.things[i];
  const here=t&&existsFor(i,"you");
  if(here&&t.t==="stone"&&formAt(i)==="door"){S.won=true;win();return;}
  if(here&&blocks(i)){die(t.t==="wall"?"crush":"crushs");return;}
  if(S.terr[i]===ABYSS&&!(here&&t.t==="plank")){die("fall");return;}
}
const DEATH={fall:"There was nothing under you. (Someone else was looking at that plank.)",crush:"That wall came back while you were inside it.",crushs:"That stone came back while you were inside it."};
function die(kind){S.dead={kind,t:0};sfx("die");say(DEATH[kind],2600);const s0=S;setTimeout(()=>{if(S!==s0||!S.dead)return;doUndo(true);},900);}
function doUndo(fromDeath){if(!S)return;if(S.won&&!fromDeath)return;const s=S.undo.pop();if(s){restore(s);}S.dead=null;resolveGaze();check();}
function restart(){loadLevel(levelIndex);}
function win(){sfx("win");solved.add(levelIndex);saveSolved();const s0=S;
  setTimeout(()=>{if(S!==s0)return;const n=levelIndex+1;if(n>=LEVELS.length){showEnd();return;}
    if(LEVELS[n].ch!==LEVELS[levelIndex].ch)showChapter(LEVELS[n].ch,n);else{loadLevel(n);}},1300);}

// ───────────────────────── RENDER ─────────────────────────
const cv=document.getElementById("cv"),g=cv.getContext("2d");
let T=40,DPR=1,OX=0,OY=0,bg=null;
let F=null; // filings
function layout(){
  const stage=document.getElementById("wrap");const maxW=Math.min(stage.clientWidth-16,900),maxH=stage.clientHeight-100;
  T=Math.max(16,Math.floor(Math.min(maxW/S.w,maxH/S.h,58)));
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=S.w*T*DPR;cv.height=S.h*T*DPR;cv.style.width=S.w*T+"px";cv.style.height=S.h*T+"px";
}
function rnd(a){let s=a*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;}}
function buildFilings(){
  layout();
  const K=Math.round(Math.max(18,Math.min(44,T*T/48)));
  const n=S.w*S.h*K;const R=rnd(levelIndex+7);
  F={n,K,x:new Float32Array(n),y:new Float32Array(n),c:new Int32Array(n),a:new Float32Array(n),l:new Float32Array(n),na:new Float32Array(n),wa:new Float32Array(n),wd:new Float32Array(n)};
  const wallAt=(x,y)=>!inb(x,y)||(S.things[idx(x,y)]&&S.things[idx(x,y)].t==="wall");
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++)for(let k=0;k<K;k++){
    const j=(y*S.w+x)*K+k;const rx=R(),ry=R();F.x[j]=x+rx;F.y[j]=y+ry;F.c[j]=y*S.w+x;F.l[j]=.6+R()*.7;F.na[j]=R()*Math.PI;F.a[j]=F.na[j];
    // wall tangent: nearest non-wall edge
    let bd=9,ba=Math.PI/4+(R()-.5)*.25;
    if(!wallAt(x-1,y)&&rx<bd){bd=rx;ba=Math.PI/2;}
    if(!wallAt(x+1,y)&&1-rx<bd){bd=1-rx;ba=Math.PI/2;}
    if(!wallAt(x,y-1)&&ry<bd){bd=ry;ba=0;}
    if(!wallAt(x,y+1)&&1-ry<bd){bd=1-ry;ba=0;}
    for(const[dx,dy]of[[-1,-1],[1,-1],[-1,1],[1,1]])if(!wallAt(x+dx,y+dy)){const cx=dx<0?0:1,cy=dy<0?0:1;const d=Math.hypot(rx-cx,ry-cy);if(d<bd){bd=d;ba=Math.atan2(ry-cy,rx-cx)+Math.PI/2;}}
    F.wa[j]=ba;F.wd[j]=bd;
  }
}
function renderBackground(){
  bg=document.createElement("canvas");bg.width=cv.width;bg.height=cv.height;const b=bg.getContext("2d");b.scale(DPR,DPR);
  const W=S.w*T,H=S.h*T;b.fillStyle="#efe7d6";b.fillRect(0,0,W,H);
  const R=rnd(3);
  for(let i=0;i<W*H/14;i++){b.fillStyle=`rgba(90,70,40,${R()*.05})`;b.fillRect(R()*W,R()*H,1,1);}
  // fibres

let AC=null;function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function tone(f,d,type="sine",v=.06,slide=0,delay=0){if(!AC)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02);}
let lastClaim=0;
function sfx(k,arg){if(!AC)return;
  if(k==="step")tone(180+Math.random()*30,.06,"triangle",.03);
  if(k==="bump")tone(90,.08,"square",.02);
  if(k==="push")tone(120,.15,"triangle",.06,.7);
  if(k==="drop")tone(300,.6,"sine",.05,.2);
  if(k==="claim"){const n=performance.now();if(n-lastClaim>90){lastClaim=n;tone(880+Math.random()*120,.18,"sine",.025);}}
  if(k==="form"){const base={door:392,anchor:196,eye:330}[arg]||300;[1,1.25,1.5,2].forEach((m,i)=>tone(base*m,.9,"sine",.035,0,i*.06));}
  if(k==="win"){[523,659,784,1046].forEach((f,i)=>tone(f,.8,"sine",.05,0,i*.1));}
